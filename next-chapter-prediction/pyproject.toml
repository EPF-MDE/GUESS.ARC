[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next-chapter-prediction"
version = "0.1.0"
description = "Prédiction du contenu du chapitre n+1 d'un livre à partir des résumés des chapitres précédents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "redouane ndiaye" }]
keywords = ["nlp", "narrative", "forecasting", "knowledge-graph"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dépendances du coeur : tout ce qui est nécessaire pour inspecter un dataset,
# construire les exemples de forecasting, annoter, entraîner les baselines et
# évaluer. Volontairement léger : aucun téléchargement de modèle.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Encodeurs neuronaux et modèles entraînables. Installé séparément car lourd.
dl = [
  "torch>=2.2",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
]
# Extraction linguistique (entités, événements) de meilleure qualité.
nlp = [
  "spacy>=3.7",
]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
all = [
  "next-chapter-prediction[dl,nlp,viz,dev]",
]

[project.scripts]
ncp = "ncp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncp = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
