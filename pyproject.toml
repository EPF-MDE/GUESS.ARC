[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-arc"
version = "0.1.0"
description = "Prédiction du contenu du chapitre n+1 de One Piece"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cloudscraper>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
